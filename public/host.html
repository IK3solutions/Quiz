<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Host</title>
<style>
  :root{
    --bg:#07111f;
    --bg2:#0b1b31;
    --panel:rgba(13,28,49,.88);
    --panel2:rgba(16,39,67,.78);
    --panel3:#102746;
    --line:rgba(124,180,229,.16);
    --line-strong:rgba(66,211,235,.35);
    --text:#f4fbff;
    --muted:#91abc4;
    --brand:#20d5d9;
    --brand2:#4fc3ff;
    --accent:#7d8cff;
    --good:#42e3a5;
    --bad:#ff6f8f;
    --warn:#ffd166;
    --shadow:0 24px 70px rgba(0,0,0,.34);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(900px 600px at 8% -10%,rgba(55,178,255,.20),transparent 58%),
      radial-gradient(1000px 700px at 95% 0%,rgba(32,213,217,.12),transparent 55%),
      linear-gradient(180deg,#081729 0%,#06101e 100%);
    color:var(--text);min-height:100vh;
  }
  body:before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;
    background-image:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px);
    background-size:36px 36px;
  }
  button,input{font:inherit}
  
  .wrap{max-width:1220px;margin:0 auto;padding:28px 24px}
  header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:24px}
  .logo{display:flex;align-items:center;gap:14px}
  .logo .brandmark{
    width:54px;height:54px;border-radius:15px;object-fit:cover;display:block;
    border:1px solid rgba(124,180,229,.24);box-shadow:0 12px 30px rgba(0,0,0,.28)
  }
  .logo h1{font-size:23px;letter-spacing:.1px}
  .logo .tag{margin-top:3px;color:var(--muted);font-size:13px}
  .live{display:inline-flex;align-items:center;gap:8px;background:rgba(66,227,165,.09);border:1px solid rgba(66,227,165,.18);color:var(--good);padding:9px 13px;border-radius:999px;font-size:13px;font-weight:750}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(66,227,165,.6);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(66,227,165,.5)}70%{box-shadow:0 0 0 8px rgba(66,227,165,0)}100%{box-shadow:0 0 0 0 rgba(66,227,165,0)}}
  .grid{display:grid;grid-template-columns:360px 1fr;gap:20px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:22px;padding:22px;
    box-shadow:var(--shadow);backdrop-filter:blur(14px)
  }
  .card h2{font-size:12px;color:#86a9c9;text-transform:uppercase;letter-spacing:1.6px;margin-bottom:15px}
  #qrCard{position:sticky;top:18px;align-self:start}
  .qr-wrap{padding:15px;background:linear-gradient(180deg,#fff,#f6fbff);border-radius:18px;border:1px solid rgba(255,255,255,.5)}
  .qr{width:100%;aspect-ratio:1/1;background:#fff;border-radius:11px;padding:6px;display:grid;place-items:center}
  .qr img{width:100%;height:100%;image-rendering:auto;border-radius:7px}
  .joinurl{margin-top:12px;text-align:center;font-size:12px;color:var(--muted);word-break:break-all}
  .joinurl b{color:var(--brand)}
  .countline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:17px}
  .count{font-size:27px;font-weight:850;color:#fff}
  .count small{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-top:2px}
  .btn{border:1px solid transparent;cursor:pointer;border-radius:12px;padding:13px 17px;font-size:15px;font-weight:800;color:#03151d;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 25px rgba(32,213,217,.22);transition:.15s ease}
  .btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(32,213,217,.28)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.dim{background:rgba(130,160,190,.10);border-color:var(--line);color:var(--text);box-shadow:none}
  .players{display:flex;flex-direction:column;gap:9px;margin-top:4px;max-height:390px;overflow:auto;padding-right:3px}
  .prow{display:flex;align-items:center;justify-content:space-between;background:rgba(6,18,33,.72);border:1px solid var(--line);border-radius:13px;padding:11px 14px}
  .prow .n{font-weight:760}
  .prow .s{color:var(--brand);font-weight:850}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:34px 18px}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
  .qnum{font-size:13px;color:#8faac5;font-weight:750;letter-spacing:.5px}
  .timerbar{height:10px;background:#071526;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .timerfill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:999px;transition:width .2s linear}
  .qtext{font-size:31px;font-weight:850;line-height:1.2;margin:19px 0 23px;max-width:900px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  @media(max-width:720px){.opts{grid-template-columns:1fr}.qtext{font-size:25px}}
  .opt{background:rgba(7,21,38,.78);border:1px solid var(--line);border-radius:15px;padding:18px 20px;font-size:17px;font-weight:720;display:flex;gap:13px;align-items:center}
  .opt .key{width:37px;height:37px;border-radius:10px;background:rgba(79,195,255,.10);border:1px solid rgba(79,195,255,.18);display:grid;place-items:center;font-weight:850;color:var(--brand);flex:none}
  .answeredbar{margin-top:18px;color:var(--muted);font-size:13px}
  .answeredbar b{color:var(--text)}
  .revealMsg{font-size:19px;font-weight:820;margin-top:10px}
  .good{color:var(--good)} .bad{color:var(--bad)}
  .leader{display:flex;flex-direction:column;gap:10px}
  .lrow{display:flex;align-items:center;gap:14px;background:rgba(7,21,38,.78);border:1px solid var(--line);border-radius:13px;padding:12px 15px}
  .lrow.top{background:linear-gradient(135deg,rgba(32,213,217,.11),rgba(79,195,255,.10));border-color:rgba(66,227,165,.30);box-shadow:0 10px 24px rgba(20,200,220,.08)}
  .lrow .rank{width:42px;height:42px;border-radius:11px;background:#132b47;display:grid;place-items:center;font-weight:850;font-size:17px;flex:none}
  .lrow.top .rank{background:linear-gradient(135deg,var(--warn),#ff9d2e);color:#3a2500}
  .lrow .nm{font-weight:820;flex:1}.lrow .sc{font-weight:850;color:var(--brand);font-size:19px}
  .winner{text-align:center;padding:20px 0}.winner .cup{font-size:62px}
  .winner h2{font-size:29px;margin:8px 0 4px;color:var(--brand);text-transform:none;letter-spacing:0}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .hidden{display:none!important}
  .tally{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  @media(max-width:700px){.tally{grid-template-columns:1fr}}
  .tally .col{background:rgba(7,21,38,.78);border:1px solid var(--line);border-radius:12px;padding:13px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chips .c{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:740}
  .chip-ok{background:rgba(66,227,165,.12);color:var(--good)}
  .chip-no{background:rgba(255,111,143,.12);color:var(--bad)}
  .brand-strip{display:flex;align-items:center;gap:9px;margin-top:14px;color:var(--muted);font-size:12px}
  .brand-strip img{width:22px;height:22px;border-radius:6px;object-fit:cover}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <img class="brandmark" src="/gravityzone-logo.jpg" alt="Bitdefender GravityZone">
      <div>
        <h1>IK3 Security Quiz</h1>
        <div class="tag">IK3 Community · Time-based security quiz</div>
      </div>
    </div>
    <div class="live"><span class="dot"></span> LIVE &nbsp;<span id="liveCount">0 players</span></div>
  </header>

  <div class="grid">
    <!-- LEFT: QR / lobby -->
    <div class="card" id="qrCard">
      <h2 id="qrTitle">Join the quiz</h2>
      <div class="qr-wrap"><div class="qr"><img id="qrImg" alt="QR code to join"></div></div>
      <div class="joinurl">Scan to join at <b id="joinUrl">…</b></div>
      <div class="countline">
        <div class="count"><span id="playerCount">0</span> <small>players in lobby</small></div>
        <button class="btn" id="startBtn">Start Quiz ▶</button>
      </div>
    </div>

    <!-- RIGHT: live area -->
    <div class="card">
      <h2 id="rightTitle">Lobby</h2>

      <!-- LOBBY -->
      <div id="lobby" class="players">
        <div class="empty" id="lobbyEmpty">Waiting for players to scan the QR code…</div>
      </div>

      <!-- QUESTION -->
      <div id="quiz" class="hidden">
        <div class="qhead">
          <div class="qnum" id="qnum">Question 1 / 10</div>
          <div class="qnum" id="qTimer"></div>
        </div>
        <div class="timerbar"><div class="timerfill" id="timerfill" style="width:100%"></div></div>
        <div class="qtext" id="qtext"></div>
        <div class="opts" id="opts"></div>
        <div class="answeredbar"><b id="answered">0</b> / <span id="pcount">0</span> answered</div>
      </div>

      <!-- REVEAL -->
      <div id="reveal" class="hidden">
        <div class="qnum" id="rnum">Question 1 / 10</div>
        <div class="qtext" id="rtext"></div>
        <div class="revealMsg" id="revealMsg"></div>
        <div class="tally" id="tally"></div>
        <div class="btns">
          <button class="btn" id="nextBtn">Next Question ▶</button>
          <button class="btn dim" id="endBtn">End Game</button>
        </div>
      </div>

      <div class="brand-strip"><img src="/gravityzone-logo.jpg" alt=""><span>IK3 Community Quiz</span></div>

      <!-- GAME OVER -->
      <div id="over" class="hidden">
        <div class="winner" id="winnerBlock"></div>
        <h2 style="color:var(--muted);text-transform:uppercase;font-size:13px;letter-spacing:1.2px;margin:8px 0">Final leaderboard</h2>
        <div class="leader" id="finalBoard"></div>
        <div class="btns">
          <button class="btn" id="againBtn">Play Again</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const wsProto=location.protocol==='https:'?'wss':'ws';
const sock=new WebSocket(`${wsProto}://${location.host}`);
let hostState=null;
let rankified=[];

// ---- QR ----
fetch('/api/qr').then(r=>r.json()).then(d=>{
  $('#qrImg').src=d.dataUrl; $('#joinUrl').textContent=d.url;
});

// ---- helpers ----
const shapes=['A','B','C','D'];
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

function renderLobby(){
  $('#lobby').innerHTML='';
  const list=hostState.players;
  if(!list.length){$('#lobby').appendChild(el('div','empty','Waiting for players to scan the QR code…'));}
  else{list.forEach(p=>{const r=el('div','prow');r.appendChild(el('span','n',escapeHtml(p.name)));r.appendChild(el('span','s',p.score+' pts'));$('#lobby').appendChild(r);});}
  $('#playerCount').textContent=hostState.playerCount;
  $('#startBtn').disabled=hostState.playerCount===0;
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let localQ=null, localStart=0, localTime=20, ticker=null;

function renderQuestion(){
  localQ=hostState.current; localStart=hostState.qStart; localTime=hostState.qTime;
  const q=hostState.currentQuestion||qCache[hostState.current];
  if(!q){return;}
  $('#qnum').textContent=`Question ${hostState.current+1} / ${hostState.total}`;
  $('#qtext').textContent=q.text;
  $('#opts').innerHTML='';
  q.options.forEach((o,i)=>{$('#opts').appendChild(el('div','opt',`<span class="key">${shapes[i]}</span><span>${escapeHtml(o)}</span>`));});
  $('#pcount').textContent=hostState.playerCount;
  $('#answered').textContent=hostState.answerCount;
  startTicker();
}

function startTicker(){
  clearInterval(ticker);
  const draw=()=>{
    const remaining=Math.max(0,localTime-(Date.now()-localStart)/1000);
    $('#qTimer').textContent=Math.ceil(remaining)+'s';
    $('#timerfill').style.width=(remaining/localTime*100)+'%';
    if(remaining<=4){$('#timerfill').style.background='linear-gradient(90deg,#ff5d7b,#ffcf5c)';}
    else{$('#timerfill').style.background='linear-gradient(90deg,var(--brand),var(--brand2))';}
  };
  draw(); ticker=setInterval(draw,200);
}

let qCache={};

function show(section){
  ['lobby','quiz','reveal','over'].forEach(s=>$('#'+s).classList.add('hidden'));
  if(section)$('#'+section).classList.remove('hidden');
}

function renderReveal(){
  const r=revealCache||{};
  $('#rnum').textContent=`Question ${(hostState.current+1)} / ${hostState.total}`;
  $('#rtext').textContent=r.text||'';
  $('#revealMsg').innerHTML=`Correct answer: <b style="color:#fff">${shapes[r.correct]} — ${escapeHtml(r.options?r.options[r.correct]:'')}</b>`;
  // tally
  const optEls=$('#tally'); optEls.innerHTML='';
  (hostState.players||[]).forEach(p=>{
    const col=el('div','col');
    const res=(r.results||[]).find(x=>x.pid===p.id);
    const ok=res&&res.correct;
    col.appendChild(el('div','qnum',escapeHtml(p.name)));
    col.appendChild(el('div','revealMsg '+(ok?'good':'bad'),ok?('+'+res.gained+' pts'):'—'));
    optEls.appendChild(col);
  });
  // next button label
  $('#nextBtn').textContent = (hostState.current+1<hostState.total)?'Next Question ▶':'Finish & Show Winner 🏆';
}

function renderOver(){
  const ranked=[...hostState.players].sort((a,b)=>b.score-a.score);
  const fb=$('#finalBoard'); fb.innerHTML='';
  ranked.forEach((p,i)=>{
    const r=el('div','lrow'+(i===0?' top':''));
    r.appendChild(el('div','rank',(i+1)));
    r.appendChild(el('div','nm',escapeHtml(p.name)));
    r.appendChild(el('div','sc',p.score+' pts'));
    fb.appendChild(r);
  });
  const w=ranked[0];
  if(w){$('#winnerBlock').innerHTML=`<div class="cup">🏆</div><h2>${escapeHtml(w.name)} wins!</h2><div style="color:var(--muted)">${w.score} points · ${ranked.length} player${ranked.length!==1?'s':''}</div>`;}
  else{$('#winnerBlock').innerHTML='<div class="cup">🏁</div><h2>Game over</h2>';}
}

function switchView(){
  if(!hostState)return;
  const ph=hostState.phase;
  if(ph==='lobby'){show('lobby');renderLobby();}
  else if(ph==='question'){show('quiz');renderQuestion();}
  else if(ph==='reveal'){show('reveal');renderReveal();}
  else if(ph==='gameover'){show('over');renderOver();}
}

sock.onmessage=e=>{
  const m=JSON.parse(e.data);
  if(m.type==='hostState'){hostState=m;switchView();$('#liveCount').textContent=m.playerCount+' players';}
  else if(m.type==='question'){qCache[m.index]={text:m.text,options:m.options,time:m.time};}
  else if(m.type==='reveal'){revealCache=m;}
};

let revealCache=null;

sock.onopen=()=>sock.send(JSON.stringify({type:'joinHost'}));

$('#startBtn').onclick=()=>sock.send(JSON.stringify({type:'ctrl',action:'start'}));
$('#nextBtn').onclick=()=>{
  if(hostState&&hostState.current+1<hostState.total)sock.send(JSON.stringify({type:'ctrl',action:'next'}));
  else sock.send(JSON.stringify({type:'ctrl',action:'end'}));
};
$('#endBtn').onclick=()=>sock.send(JSON.stringify({type:'ctrl',action:'end'}));
$('#againBtn').onclick=()=>sock.send(JSON.stringify({type:'ctrl',action:'reset'}));
</script>
</body>
</html>
