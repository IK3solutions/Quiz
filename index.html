<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizRush — Endpoint Security × Trend Micro</title>
<style>
  :root{--brand:#1fb6a8;--brand2:#38cfc1;--bg:#0b1220;--panel:#141d30;--text:#eaf0fa;--muted:#8aa0c4;--accent:#4f7cff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1100px 800px at 50% -10%,#16324a 0%,var(--bg) 55%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{text-align:center;max-width:520px}
  .bolt{width:70px;height:70px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:38px;color:#04231f;margin:0 auto 20px;box-shadow:0 12px 30px rgba(31,182,168,.4)}
  h1{font-size:30px;letter-spacing:.5px}
  .tag{color:var(--muted);margin-top:8px;font-size:14px}
  .btns{display:flex;flex-direction:column;gap:14px;margin-top:36px}
  a.btn{display:block;text-decoration:none;border-radius:14px;padding:18px;font-size:18px;font-weight:800;color:#04231f;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 24px rgba(31,182,168,.35)}
  a.btn.alt{background:#1c2942;color:var(--text);box-shadow:none}
  .foot{margin-top:30px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bolt">⚡</div>
  <h1>QuizRush</h1>
  <div class="tag">Rapid-fire quiz · Endpoint Security × Trend Micro · 10 timed questions</div>
  <div class="btns">
    <a class="btn" href="/host">🎤 Open Presenter (Host) Screen</a>
    <a class="btn alt" href="/play">📱 Join as a Player</a>
  </div>
  <div class="foot">Players scan the QR code shown on the host screen to join. Score points by answering correctly and fast!</div>
</div>
</body>
</html>
