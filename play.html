<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizRush — Play</title>
<style>
  :root{--bg:#0b1220;--panel:#141d30;--panel2:#1c2942;--text:#eaf0fa;--muted:#8aa0c4;
    --brand:#1fb6a8;--brand2:#38cfc1;--accent:#4f7cff;--good:#2fd58b;--bad:#ff5d7b;--warn:#ffcf5c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1000px 700px at 50% -10%,#16324a 0%,var(--bg) 55%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid #26334f;border-radius:20px;padding:26px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .logo .bolt{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:20px;color:#04231f}
  .logo b{font-size:18px}
  h2{font-size:20px;margin-bottom:6px}
  .muted{color:var(--muted);font-size:13px;line-height:1.4}
  label{display:block;font-size:13px;color:var(--muted);margin:18px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  input{width:100%;background:#0f1930;border:1px solid #2a3a5c;border-radius:12px;padding:14px;font-size:17px;color:var(--text);outline:none}
  input:focus{border-color:var(--brand)}
  .btn{width:100%;border:0;cursor:pointer;border-radius:12px;padding:15px;font-size:17px;font-weight:800;color:#04231f;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 8px 20px rgba(31,182,168,.35);margin-top:16px}
  .btn:hover{transform:translateY(-2px)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .wait{text-align:center;padding:10px 0}
  .pulse{width:46px;height:46px;border:4px solid rgba(56,207,193,.25);border-top-color:var(--brand2);border-radius:50%;margin:14px auto;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .qnum{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .timer{font-size:34px;font-weight:800;color:var(--brand2);text-align:right;line-height:1}
  .timer.warn{color:var(--bad)}
  .qhead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
  .timerbar{height:9px;background:#0f1930;border-radius:999px;overflow:hidden;border:1px solid #26334f;margin-bottom:16px}
  .timerfill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .2s linear}
  .qtext{font-size:20px;font-weight:800;line-height:1.35;margin-bottom:18px;min-height:54px}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{background:#0f1930;border:1px solid #2a3a5c;border-radius:14px;padding:16px;font-size:16px;font-weight:700;color:var(--text);cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center;transition:.1s}
  .opt:active{transform:scale(.98)}
  .opt.pick{border-color:var(--brand);background:rgba(31,182,168,.15)}
  .opt.correct{border-color:var(--good);background:rgba(47,213,139,.18)}
  .opt.wrong{border-color:var(--bad);background:rgba(255,93,123,.15)}
  .opt:disabled{cursor:default}
  .opt .key{width:34px;height:34px;border-radius:9px;background:#26334f;display:grid;place-items:center;font-weight:800;color:var(--brand2);flex:none}
  .status{margin-top:18px;text-align:center;font-weight:800;font-size:18px}
  .good{color:var(--good)} .bad{color:var(--bad)}
  .statline{display:flex;justify-content:space-between;margin-top:8px}
  .statline .muted{font-size:14px}
  .score{font-size:14px;color:var(--muted);margin-top:16px}
  .score b{color:var(--brand2);font-size:22px}
  .rankbadge{display:inline-block;background:#26334f;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;color:var(--brand2)}
  .hidden{display:none!important}
  .wincup{font-size:60px;text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="bolt">⚡</div><b>QuizRush</b></div>

  <!-- JOIN -->
  <div id="joinView">
    <h2>Join the quiz</h2>
    <p class="muted">Endpoint Security × Trend Micro · 10 rapid-fire questions. Answer fast &amp; correctly to score.</p>
    <label>Your name</label>
    <input id="name" maxlength="20" placeholder="e.g. Alex" autocomplete="off">
    <button class="btn" id="joinBtn">Join Game</button>
  </div>

  <!-- WAITING -->
  <div id="waitView" class="hidden wait">
    <h2>You're in! 🎉</h2>
    <p class="muted">You're <b id="wName" style="color:var(--brand2)"></b>. Wait for the host to start the game.</p>
    <div class="pulse"></div>
    <div class="score" id="waitScore"></div>
  </div>

  <!-- QUESTION -->
  <div id="quizView" class="hidden">
    <div class="qhead">
      <div class="qnum" id="qnum">Question 1 / 10</div>
      <div class="timer" id="qtimer">20s</div>
    </div>
    <div class="timerbar"><div class="timerfill" id="qfill" style="width:100%"></div></div>
    <div class="qtext" id="qtext"></div>
    <div class="opts" id="opts"></div>
    <div class="score" id="qScore" style="margin-top:16px"></div>
  </div>

  <!-- REVEAL -->
  <div id="revealView" class="hidden">
    <div class="qnum">Result</div>
    <div class="status" id="verdict"></div>
    <div class="muted" style="text-align:center;margin-top:6px" id="correctLine"></div>
    <div class="statline"><span class="muted">You earned</span><b id="gained" style="color:var(--brand2);font-size:22px"></b></div>
    <div class="score">Total score: <b id="totalScore">0</b> &nbsp; <span class="rankbadge" id="rankBadge">#1</span></div>
    <p class="muted" style="text-align:center;margin-top:14px">Next question coming…</p>
  </div>

  <!-- GAME OVER -->
  <div id="overView" class="hidden">
    <div class="wincup" id="overCup">🏁</div>
    <h2 style="text-align:center">Game over!</h2>
    <div class="score" style="text-align:center;font-size:16px">Your score: <b id="finalScore">0</b></div>
    <div style="text-align:center;margin-top:10px"><span class="rankbadge" id="finalRank">#1</span></div>
    <p class="muted" style="text-align:center;margin-top:12px" id="overMsg"></p>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const wsProto=location.protocol==='https:'?'wss':'ws';
const sock=new WebSocket(`${wsProto}://${location.host}`);
const shapes=['A','B','C','D'];
let ps=null; // player state
let joined=false;
let picked=false;
let sawQuestion=null, qStart=0, qTime=20, tick=null;

function show(id){['joinView','waitView','quizView','revealView','overView'].forEach(v=>$('#'+v).classList.add('hidden'));$('#'+id).classList.remove('hidden');}

function setScore(){if(ps){$('#qScore').innerHTML='Score: <b>'+ps.myScore+'</b>';}}

function startTicker(){
  clearInterval(tick);
  const draw=()=>{
    const remaining=Math.max(0,qTime-(Date.now()-qStart)/1000);
    $('#qtimer').textContent=Math.ceil(remaining)+'s';
    $('#qfill').style.width=(remaining/qTime*100)+'%';
    $('#qtimer').classList.toggle('warn',remaining<=4);
    $('#qfill').style.background=remaining<=4?'linear-gradient(90deg,#ff5d7b,#ffcf5c)':'linear-gradient(90deg,var(--brand),var(--brand2))';
  };
  draw();tick=setInterval(draw,200);
}

function showQuestion(m){
  sawQuestion=m.index;
  $('#qnum').textContent=`Question ${m.index+1} / ${m.total}`;
  $('#qtext').textContent=m.text;
  $('#opts').innerHTML='';
  m.options.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';b.dataset.i=i;
    b.innerHTML=`<span class="key">${shapes[i]}</span><span>${escapeHtml(o)}</span>`;
    b.onclick=()=>answer(i);
    $('#opts').appendChild(b);
  });
  qStart=m.qStart;qTime=m.time;picked=false;
  startTicker();setScore();
}

function answer(i){
  if(picked||sawQuestion==null||!joined)return;
  picked=true; myPicked=i;
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach(b=>b.disabled=true);
  btns[i].classList.add('pick');
  sock.send(JSON.stringify({type:'answer',index:sawQuestion,choice:i}));
}

function applyPlayerState(m){
  // update score during question
  if(ps===null||m.myScore!==ps.myScore)setScore();
  ps=m;
  $('#waitScore').innerHTML='Score: <b>'+m.myScore+'</b>';
  // if we're on the reveal screen, refresh totals
  if(!$('#revealView').classList.contains('hidden')){
    $('#totalScore').textContent=m.myScore;
    if(m.rank)$('#rankBadge').textContent='#'+m.rank;
  }
}

function showReveal(m){
  clearInterval(tick);
  const res=(m.results||[]).find(r=>r.pid===myId);
  const mine=res?res.correct:false;
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach(b=>{
    const i=+b.dataset.i;
    b.disabled=true;
    if(i===m.correct)b.classList.add('correct');
    else if(i===+myPicked&&i===sawQuestion)b.classList.add('wrong');
  });
  $('#verdict').className='status '+(mine?'good':'bad');
  $('#verdict').textContent=mine?'Correct! 🎉':'Wrong / no answer';
  $('#correctLine').textContent=`Correct answer: ${shapes[m.correct]} — ${m.options[m.correct]}`;
  $('#gained').textContent=(res?res.gained:0)+' pts';
  // ps is pre-reveal here, so add earned points for the total; playerState will confirm.
  $('#totalScore').textContent=(ps?ps.myScore:0)+(res?res.gained:0);
  if(ps&&ps.rank)$('#rankBadge').textContent='#'+ps.rank;
}

sock.onopen=()=>{};
sock.onmessage=e=>{
  const m=JSON.parse(e.data);
  if(m.type==='welcome'){myId=m.playerId;$('#wName').textContent=m.name;}
  else if(m.type==='joined'||m.type==='playerState'){applyPlayerState(m);}
  else if(m.type==='question'){show('quizView');showQuestion(m);setScore();}
  else if(m.type==='reveal'){myPicked=myPicked;showReveal(m);show('revealView');}
  else if(m.type==='gameover'||m.type==='playerState'&&m.phase==='gameover'){
    show('overView');
    if(ps){$('#finalScore').textContent=ps.myScore;$('#finalRank').textContent='#'+ps.rank;
      $('#overCup').textContent=ps.rank===1?'🏆':'🏁';
      $('#overMsg').textContent=ps.rank===1?'Congratulations — you won! 🎉':'Good job! Thanks for playing.';}
  }
  else if(m.type==='playerState'){
    if(m.phase==='lobby')show('waitView');
  }
  else if(m.type==='reset'){sawQuestion=null;picked=false;show('waitView');}
};

let myId=null,myPicked=null;

$('#joinBtn').onclick=()=>{
  const name=$('#name').value.trim();
  if(!name){$('#name').focus();return;}
  sock.send(JSON.stringify({type:'join',name}));
  joined=true;
  show('waitView');
};
$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')$('#joinBtn').click();});

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
